# Push to main -> build the Docker image on GitHub's runners -> push it to
# GitHub Container Registry -> SSH into the droplet and restart the app.
#
# Repository secrets required (Settings -> Secrets and variables -> Actions):
#   DROPLET_HOST      droplet public IP
#   DROPLET_SSH_KEY   private key whose public half is in the droplet's
#                     /root/.ssh/authorized_keys (a key used only for deploys)
# The droplet pulls the image with this job's short-lived GITHUB_TOKEN, so no
# long-lived registry token is stored anywhere.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${repo}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile,deploy/backup.sh"
          target: /opt/marketingai
          strip_components: 1

      - name: Pull new image and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/marketingai
            chmod +x backup.sh
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${{ needs.build.outputs.image }}|" .env
            docker compose pull app
            docker logout ghcr.io
            docker compose up -d --remove-orphans
            docker image prune -f
            # Fail the deploy if the app doesn't come up.
            for i in $(seq 1 30); do
              if docker compose exec -T app node -e "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "App is up"; exit 0
              fi
              sleep 5
            done
            docker compose logs --tail=100 app
            exit 1
